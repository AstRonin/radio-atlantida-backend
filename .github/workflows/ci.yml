name: ci

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs the whole CI before it builds a release.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go vet
        run: |
          go vet ./...
          go vet -tags integration ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Go version in the Dockerfile
        run: |
          mod=$(go mod edit -json | jq -r .Go)
          img=$(sed -n 's/^ARG GO_VERSION=//p' docker/Dockerfile)
          if [ "$mod" != "$img" ]; then
            echo "go.mod says $mod, docker/Dockerfile GO_VERSION says $img"; exit 1
          fi
      - name: line endings and paths
        # Development is on macOS, runtime on Windows (§9.1): no CRLF and no
        # file names that differ only by case.
        run: |
          if git ls-files --eol | grep -E '^i/crlf'; then
            echo "files with CRLF line endings"; exit 1
          fi
          dups=$(git ls-files | tr '[:upper:]' '[:lower:]' | sort | uniq -d)
          if [ -n "$dups" ]; then echo "case-insensitive duplicates: $dups"; exit 1; fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: install ffmpeg
        # The import tests analyse and encode real files (the runtime image
        # has ffmpeg too).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: unit and integration tests
        # testcontainers-go uses the Docker engine of the runner.
        run: go test -race -tags integration ./...

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: generate
        run: |
          mkdir -p api
          go run ./cmd/backend openapi > api/openapi.json
      - name: validate
        run: npx --yes @redocly/cli@2.61.0 lint --config redocly.yaml api/openapi.json
      # Input of the radio-atlantida-frontend client build (§6.4). The release
      # workflow publishes it with the tagged images.
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: api/openapi.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
