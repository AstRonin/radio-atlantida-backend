# TLS proxy in front of the test Icecast (dev/liqsmoke): the source
# connection of the script over TLS, as to the production server (§8.8).
pid /tmp/nginx.pid;
events {}
stream {
  server {
    listen 8443 ssl;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    proxy_pass icecast:8000;
  }
}
