# Live reload for `make dev` (https://github.com/air-verse/air).
root = "."
tmp_dir = "bin"

[build]
cmd = "go build -o bin/backend-dev ./cmd/backend"
entrypoint = ["bin/backend-dev", "serve"]
include_ext = ["go", "sql"]
# dev/ holds only tools and tests of the dev stack; it is not part of the binary.
exclude_dir = [".claude", ".dev", ".git", "api", "bin", "dev", "docker", "docs"]
exclude_regex = ["_test\\.go$"]
delay = 500
log = "air-build-errors.log"
# After a failed build air restarts the last binary that built.
stop_on_error = false
# serve drains on SIGINT; air sends SIGKILL only if it is still running after
# kill_delay, so a normal restart does not wait for the whole delay.
send_interrupt = true
kill_delay = "15s"

[misc]
clean_on_exit = false
