# Development and test stack. NOT for production: the production compose file
# lives in radio-atlantida-deploy (§1.1 of docs/tech-design.md).
#
#   make stack-up                      db, icecast, liquidsoap, loki, alloy (backend runs on the host: make run)
#   docker compose -f docker-compose.dev.yml --profile app up --build
#                                      the same plus the backend container
#   make monitoring-up                 Grafana (profile monitoring) with the live
#                                      database view and the log search (Loki),
#                                      http://127.0.0.1:3000
#
# Startup configuration of every service is set here through `environment:`
# (values from .env). The connection values the backend uses to reach Icecast
# and Liquidsoap (host names, ports, mount, stream format) are admin settings
# whose code defaults must match this file: NewRegistry in internal/settings,
# checked by TestDefaultsMatchDevStack. Change both together.
#
# All published ports are bound to 127.0.0.1 only.

name: radio-atlantida-dev

services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  icecast:
    image: libretime/icecast:2.4.4-alpine
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?set in .env}
      ICECAST_ADMIN_USERNAME: ${ICECAST_ADMIN_USERNAME:-admin}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:?set in .env}
      ICECAST_RELAY_PASSWORD: ${ICECAST_RELAY_PASSWORD:?set in .env}
      ICECAST_HOSTNAME: localhost
      ICECAST_MAX_CLIENTS: "20"
      ICECAST_MAX_SOURCES: "4"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/status-json.xsl"]
      interval: 5s
      timeout: 3s
      retries: 10

  liquidsoap:
    image: savonet/liquidsoap:v2.4.6
    command: ["/etc/liquidsoap/radio.liq"]
    environment:
      TZ: UTC
      ICECAST_HOST: icecast
      ICECAST_PORT: "8000"
      ICECAST_MOUNT: /radio
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?set in .env}
      LIQUIDSOAP_CONTROL_USER: ${LIQUIDSOAP_CONTROL_USER:-source}
      LIQUIDSOAP_CONTROL_PASSWORD: ${LIQUIDSOAP_CONTROL_PASSWORD:?set in .env}
      TELNET_PORT: "1234"
      HARBOR_PORT: "8005"
      JOURNAL_DIR: /journal
      BACKEND_CALLBACK_URL: ${BACKEND_CALLBACK_URL:-http://host.docker.internal:8090/api/playout/callback}
      BACKEND_EMERGENCY_URL: ${BACKEND_EMERGENCY_URL:-http://host.docker.internal:8090/api/playout/emergency/next}
    # Published only so a backend running on the host can reach them in
    # development. In production they stay on the internal network (§8.9).
    ports:
      - "127.0.0.1:1234:1234"
      - "127.0.0.1:8005:8005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${MEDIA_ROOT:?set in .env}:/media:ro
      - ${PLAYOUT_JOURNAL_ROOT:?set in .env}:/journal
      - ./dev/liquidsoap/radio.liq:/etc/liquidsoap/radio.liq:ro
    depends_on:
      icecast:
        condition: service_healthy
    healthcheck:
      # The telnet control port answers: send `quit`, expect `Bye!`.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/1234 && echo quit >&3 && timeout 2 grep -q Bye <&3"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Applies the migrations once and exits; backend starts only after it
  # succeeds (§9.2). Same image as backend.
  migrate:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: radio-atlantida-backend:dev
    command: ["migrate", "up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    # The image health check probes the HTTP server, which migrate does not run.
    healthcheck:
      disable: true
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  backend:
    profiles: ["app"]
    image: radio-atlantida-backend:dev
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      MEDIA_ROOT: /media
      # The backend pushes its log to Loki and does not wait for it (docs/logs-loki-plan.md §5.2).
      LOKI_URL: http://loki:3100
      PLAYOUT_JOURNAL_ROOT: /journal
      HTTP_ADDR: 0.0.0.0:8090
      # Live voice (WebRTC): one UDP port for every session. The browser
      # cannot reach the container's own address, so the bridge offers the
      # published one (docs/phase-12-plan.md §2, decision 4).
      LIVE_UDP_ADDR: 0.0.0.0:8189
      LIVE_PUBLIC_IPS: 127.0.0.1
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?set in .env}
      LIQUIDSOAP_CONTROL_USER: ${LIQUIDSOAP_CONTROL_USER:-source}
      LIQUIDSOAP_CONTROL_PASSWORD: ${LIQUIDSOAP_CONTROL_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:8090:8090"
      - "127.0.0.1:8189:8189/udp"
    volumes:
      # Read-write: a transcode writes fixed files (docs/phase-11-plan.md);
      # an import only reads (docs/phase-18-plan.md).
      - ${MEDIA_ROOT:?set in .env}:/media
      # Playout journal, read for reconciliation (§7.1).
      - ${PLAYOUT_JOURNAL_ROOT:?set in .env}:/journal:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Creates or updates the read-only role grafana_ro (dev/grafana/role.sql)
  # with GRAFANA_DB_PASSWORD and exits; grafana starts only after it
  # succeeds (docs/tech-design.md §10.3). POSTGRES_USER is a superuser in
  # the official image.
  grafana-role:
    profiles: ["monitoring"]
    image: postgres:17.11
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/role.sql"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?set in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      PGDATABASE: ${POSTGRES_DB:?set in .env}
      PGOPTIONS: -c radio.grafana_password=${GRAFANA_DB_PASSWORD:-dev-grafana-db-pass}
    volumes:
      - ./dev/grafana/role.sql:/role.sql:ro
    # The image health check is for a server; this job only runs psql.
    healthcheck:
      disable: true
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  # Live view of PostgreSQL for the operator (docs/phase-14-plan.md). Login
  # required; the admin password applies only when grafana-data is created
  # (make monitoring-reset applies a new one).
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-dev-grafana-pass}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # The station machine may be offline.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Read by the data source file (provisioning/datasources/postgres.yaml).
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-dev-grafana-db-pass}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./dev/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dev/grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    depends_on:
      grafana-role:
        condition: service_completed_successfully
      # The Logs dashboard's data source. Started, not healthy: loki has no
      # health check (below).
      loki:
        condition: service_started

  # Log storage (docs/logs-loki-plan.md). A core service: the backend pushes its
  # log here, Alloy sends the playout journal here, and the Logs page of the panel
  # and Grafana query it. Published on 127.0.0.1 in development only, so a backend
  # on the host (make run) can push; production publishes no port.
  #
  # No health check: the image is distroless (only /usr/bin/loki, no shell,
  # wget, or curl) and loki has no health subcommand. The backend retries its
  # pushes and drops lines when Loki is down (never blocks), Alloy retries with
  # backoff, and Grafana's data source answers once Loki is ready (/ready on
  # 3100), so nothing needs to wait for it.
  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki-data:/loki
      - ./dev/loki/loki.yaml:/etc/loki/loki.yaml:ro

  # Reads the playout journal from the host (read-only) and sends every line to
  # Loki (dev/alloy/config.alloy). Read positions live in alloy-data, so a restart
  # neither loses nor repeats lines. Its UI shows the pipeline:
  # http://127.0.0.1:12345 (dev only).
  # A core service (docs/logs-loki-plan.md §3.4): the journal needs it.
  alloy:
    image: grafana/alloy:v1.20.1
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - alloy-data:/var/lib/alloy/data
      - ./dev/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ${PLAYOUT_JOURNAL_ROOT:?set in .env}:/journal:ro
    healthcheck:
      # The image has bash but neither wget nor curl.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && timeout 2 head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      loki:
        condition: service_started

volumes:
  pgdata:
  grafana-data:
  loki-data:
  alloy-data:
