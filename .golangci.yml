version: "2"

run:
  build-tags:
    - integration

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
    - unconvert
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment # readability over struct packing
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: unused-parameter
        - name: var-naming
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Test helpers and fixtures do not need doc comments.
      - path: _test\.go
        linters: [revive]
        text: "exported"

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/AstRonin/radio-atlantida-backend
